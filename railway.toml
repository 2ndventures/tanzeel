[build]
builder = "NIXPACKS"
buildCommand = "npm install --include=dev && npm run build && esbuild server/instrument.ts --platform=node --packages=external --bundle --format=esm --outfile=dist/instrument.js"

[deploy]
startCommand = "NODE_ENV=production node --import ./dist/instrument.js dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
